name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show build environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
      - name: Run regression tests and build IPA
        run: bash build.sh
      - name: Create checksum
        run: shasum -a 256 WQFiles.ipa > WQFiles.ipa.sha256
      - name: Upload IPA for re-signing
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles-IPA
          path: |
            WQFiles.ipa
            WQFiles.ipa.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-logs
          path: .work/tests/**/*.log
          if-no-files-found: ignore
          retention-days: 14
